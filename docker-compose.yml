# LeonidApp — despliegue portable.
#   Producción (MongoDB Atlas):  docker compose --env-file .env.production up -d --build
#   Prueba local con Mongo propio: docker compose --env-file .env.production --profile local-db up -d --build
#     (en ese caso usa MONGODB_URI=mongodb://mongo:27017/leonidapp)
services:
  app:
    build:
      context: .
      args:
        # Se incrusta en el bundle del cliente: debe ser la URL pública final (https).
        VITE_API_URL: ${VITE_API_URL:?define VITE_API_URL en .env.production}
    image: leonidapp:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?define MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET (>= 32 caracteres)}
      COOKIE_SECRET: ${COOKIE_SECRET:?define COOKIE_SECRET (>= 32 caracteres)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?}
      APP_DEEPLINK: ${APP_DEEPLINK:-leonidapp://auth/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-LeonidApp <no-reply@localhost>}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      PIPELINE_INGEST_TOKEN: ${PIPELINE_INGEST_TOKEN:-}
      PIPELINE_WEBHOOK_URL: ${PIPELINE_WEBHOOK_URL:-}

  mongo:
    profiles: ["local-db"]
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
