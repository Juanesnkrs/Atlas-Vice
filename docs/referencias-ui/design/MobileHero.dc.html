<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acceso móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2E1A47;font-family:'Poppins',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
::placeholder{color:rgba(255,255,255,.64)}
:focus-visible{outline:2px solid #FFC09A;outline-offset:2px}
.hv:hover{filter:brightness(1.1)}
.glass{background:rgba(20,14,36,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(246,146,89,.25)}
.pbtn{position:relative;overflow:hidden;background:linear-gradient(90deg,#E1307E,#F67E56);border:1px solid rgba(255,255,255,.28);color:#1A0A22;font-weight:700;text-decoration:none}
.pbtn>span{position:relative}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:linear-gradient(180deg,#2E1A47 0%,#7B2C6F 35%,#E14B7B 70%,#F69259 100%);color:#FBF1F5;font-family:'Poppins',system-ui,sans-serif">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E1307E"></stop><stop offset="1" stop-color="#F69259"></stop></linearGradient>
<linearGradient id="sunH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E1307E"></stop><stop offset="1" stop-color="#F67E56"></stop></linearGradient>
<clipPath id="txtclip"><text x="210" y="92" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="74" textLength="404" lengthAdjust="spacingAndGlyphs">ATLAS VICE</text></clipPath>
<symbol id="palm" viewBox="0 0 130 400">
<path d="M60 400 C57 300 58 200 63 72 L67 72 C62 200 64 300 66 400 Z" fill="currentColor"></path>
<g transform="translate(65 72)" fill="currentColor">
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="rotate(-45)"></path>
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="rotate(-12)"></path>
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="rotate(22)"></path>
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="rotate(-80)"></path>
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="scale(-1 1) rotate(-45)"></path>
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="scale(-1 1) rotate(-12)"></path>
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="scale(-1 1) rotate(22)"></path>
<path d="M0 0 C16 -14 42 -15 60 6 C42 -3 20 -4 0 0 Z" transform="scale(-1 1) rotate(-80)"></path>
</g>
</symbol>
<symbol id="sky" viewBox="0 0 1000 80" preserveAspectRatio="none">
<path fill="currentColor" d="M0 80 V52 H30 V36 H48 V52 H70 V22 H92 V52 H110 V40 H140 V14 H150 V6 H156 V14 H166 V44 H196 V30 H220 V50 H250 V26 H262 V18 H282 V50 H312 V38 H340 V54 H372 V30 H392 V10 H414 V30 H434 V46 H466 V34 H488 V52 H520 V20 H536 V12 H552 V20 H566 V48 H600 V36 H628 V52 H660 V28 H684 V50 H716 V40 H744 V18 H758 V8 H770 V18 H786 V46 H820 V32 H846 V52 H878 V38 H904 V54 H940 V42 H970 V56 H1000 V80 Z"></path>
</symbol>
<symbol id="logo" viewBox="0 0 420 150">
<g clip-path="url(#txtclip)">
<rect x="0" y="20" width="420" height="80" fill="url(#sunG)"></rect>
<g fill="#2E1A47" opacity=".5">
<use href="#palm" x="4" y="12" width="40" height="124"></use><use href="#palm" x="62" y="18" width="36" height="112"></use><use href="#palm" x="118" y="10" width="40" height="124"></use><use href="#palm" x="176" y="18" width="36" height="112"></use><use href="#palm" x="232" y="12" width="40" height="124"></use><use href="#palm" x="290" y="18" width="36" height="112"></use><use href="#palm" x="344" y="10" width="40" height="124"></use><use href="#palm" x="384" y="18" width="36" height="112"></use>
</g>
</g>
<text x="210" y="92" text-anchor="middle" font-family="Jost,sans-serif" font-weight="700" font-size="74" textLength="404" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="1.3">ATLAS VICE</text>
<use href="#sky" x="14" y="104" width="392" height="34" style="color:#5A2A73"></use>
<rect x="14" y="138" width="392" height="2.5" rx="1.2" fill="url(#sunH)"></rect>
</symbol>
</defs>
</svg>

<svg aria-hidden="true" viewBox="0 0 1000 80" preserveAspectRatio="none" style="position:absolute;left:0;bottom:0;width:390px;height:120px;color:#2A1240;opacity:.55"><use href="#sky"></use></svg>

<div style="position:absolute;left:0;top:0;width:390px;height:290px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,#000 70%,transparent 100%)">
<img src="assets/hero.jpg" alt="Lucía y Jason frente a la gasolinera Xero al atardecer, con pañuelos sobre el rostro" style="position:absolute;left:0;bottom:0;width:390px;height:487px;max-width:none">
</div>
<div style="position:absolute;left:0;right:0;top:20px;display:flex;justify-content:center">
<svg viewBox="0 0 420 150" width="240" height="86" role="img" aria-label="ATLAS VICE" style="filter:drop-shadow(0 2px 10px rgba(20,14,36,.6))"><use href="#logo"></use></svg>
</div>

<div style="position:absolute;left:24px;right:24px;top:270px">
<div style="height:48px;box-sizing:border-box;padding:4px;border-radius:24px;display:flex;background:rgba(20,14,36,.78);border:1px solid rgba(246,146,89,.3)">
<button onClick="{{goLogin}}" aria-pressed="{{loginPressed}}" style="flex:1;border:0;border-radius:20px;color:{{loginFg}};font-size:14px;font-weight:700;background:{{loginBg}}">Entrar</button>
<button onClick="{{goExplore}}" aria-pressed="{{explorePressed}}" style="flex:1;border:0;border-radius:20px;color:{{exploreFg}};font-size:14px;font-weight:700;background:{{exploreBg}}">Explorar</button>
</div>

<sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}">
<div class="glass" style="margin-top:12px;padding:14px 16px 16px;border-radius:24px">
<label for="m-em" style="display:block;margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.08em;color:rgba(251,241,245,.9)">EMAIL / USUARIO</label>
<input id="m-em" type="text" placeholder="johndoe@gmail.com" style="width:100%;height:48px;box-sizing:border-box;padding:0 18px;border-radius:24px;border:1px solid rgba(246,146,89,.3);background:rgba(255,255,255,.07);color:#fff;font-size:14px">
<label for="m-pw" style="display:block;margin:10px 0 6px;font-size:11px;font-weight:600;letter-spacing:.08em;color:rgba(251,241,245,.9)">CONTRASEÑA</label>
<input id="m-pw" type="password" placeholder="••••••••" style="width:100%;height:48px;box-sizing:border-box;padding:0 18px;border-radius:24px;border:1px solid rgba(246,146,89,.3);background:rgba(255,255,255,.07);color:#fff;font-size:14px">
<div style="display:flex;justify-content:flex-end"><button style="min-height:44px;padding:0 4px;border:0;background:none;color:#FFC09A;font-size:13px;text-decoration:underline">¿Olvidaste tu contraseña?</button></div>
<a href="Mobile.dc.html" class="pbtn hv" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;font-size:17px">
<svg aria-hidden="true" viewBox="0 0 310 52" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;color:#2E1A47;opacity:.28"><use href="#palm" x="-6" y="-22" width="42" height="140"></use><use href="#palm" x="66" y="-8" width="34" height="112"></use><use href="#palm" x="136" y="-26" width="44" height="144"></use><use href="#palm" x="208" y="-10" width="36" height="120"></use><use href="#palm" x="268" y="-24" width="42" height="138"></use></svg>
<span>Entrar</span></a>
<a href="Mobile.dc.html" class="hv" style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;height:48px;box-sizing:border-box;border-radius:24px;border:1px solid rgba(246,146,89,.4);background:rgba(255,255,255,.06);color:#fff;font-weight:600;font-size:14px;text-decoration:none">
<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="13" rx="5"></rect><circle cx="9" cy="11.5" r="1.3" fill="#fff"></circle><circle cx="15" cy="11.5" r="1.3" fill="#fff"></circle></svg>Continuar con Discord</a>
<a href="Mobile.dc.html" class="hv" style="margin-top:8px;display:flex;align-items:center;justify-content:center;height:48px;box-sizing:border-box;border-radius:24px;color:#FFC09A;font-weight:600;font-size:14px;text-decoration:underline">Continuar como Invitado</a>
</div>
</sc-if>

<sc-if value="{{isExplore}}" hint-placeholder-val="{{false}}">
<div class="glass" style="margin-top:12px;padding:18px 18px 18px;border-radius:24px">
<h1 style="margin:0;font-family:'Jost',sans-serif;font-weight:700;font-size:26px;line-height:1.1">Explora Leonida</h1>
<p style="margin:6px 0 0;font-size:13px;color:rgba(251,241,245,.85)">Entra sin cuenta. Tu progreso se guarda en este dispositivo.</p>
<div style="margin:16px 0 18px;display:flex;flex-direction:column;gap:12px;font-size:13px">
<div style="display:flex;gap:12px;align-items:center"><span style="width:8px;height:8px;border-radius:4px;background:#F67E56"></span>Mapa y catálogo completos</div>
<div style="display:flex;gap:12px;align-items:center"><span style="width:8px;height:8px;border-radius:4px;background:#F67E56"></span>Foro en modo lectura</div>
<div style="display:flex;gap:12px;align-items:center"><span style="width:8px;height:8px;border-radius:4px;background:#F67E56"></span>Crea cuenta luego y suma tu avance</div>
</div>
<a href="Mobile.dc.html" class="pbtn hv" style="display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;font-size:17px">
<svg aria-hidden="true" viewBox="0 0 310 52" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;color:#2E1A47;opacity:.28"><use href="#palm" x="-6" y="-22" width="42" height="140"></use><use href="#palm" x="66" y="-8" width="34" height="112"></use><use href="#palm" x="136" y="-26" width="44" height="144"></use><use href="#palm" x="208" y="-10" width="36" height="120"></use><use href="#palm" x="268" y="-24" width="42" height="138"></use></svg>
<span>Entrar al mapa</span></a>
</div>
</sc-if>
</div>

<div style="position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:#FBF1F5">v2.0.4 • <span style="color:#8CF0B5">● EN LÍNEA</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'login' };
  }
  renderVals() {
    const inLogin = this.state.mode === 'login';
    const on = 'linear-gradient(90deg,#E1307E,#F67E56)';
    return {
      isLogin: inLogin,
      isExplore: !inLogin,
      loginBg: inLogin ? on : 'transparent',
      exploreBg: inLogin ? 'transparent' : on,
      loginFg: inLogin ? '#1A0A22' : '#FBF1F5',
      exploreFg: inLogin ? '#FBF1F5' : '#1A0A22',
      loginPressed: inLogin,
      explorePressed: !inLogin,
      goLogin: () => this.setState({ mode: 'login' }),
      goExplore: () => this.setState({ mode: 'explore' })
    };
  }
}
</script>
</body>
</html>
